name: Compilar

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar
        shell: cmd
        run: compilar.cmd

      - name: SHA256
        shell: pwsh
        run: |
          $h = (Get-FileHash salida\Instalar-Home.exe -Algorithm SHA256).Hash.ToLower()
          "$h  Instalar-Home.exe" | Out-File -Encoding ascii salida\Instalar-Home.exe.sha256
          Get-Content salida\Instalar-Home.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Instalar-Home
          path: salida/

      # Con una etiqueta vX.Y se publica la release con el .exe y su SHA256
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" salida/Instalar-Home.exe salida/Instalar-Home.exe.sha256 `
            --title "Instalar Home ${{ github.ref_name }}" --generate-notes
