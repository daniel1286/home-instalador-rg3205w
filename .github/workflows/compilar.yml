name: Compilar

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: windows-latest
    env:
      # Firma opcional: si el repositorio tiene estos secretos, el .exe sale firmado (compilar.cmd explica cómo). Sin
      # ellos, o en las pull requests de otros repositorios, se compila sin firmar
      FIRMA_PFX_BASE64: ${{ secrets.FIRMA_PFX_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Certificado de firma
        if: env.FIRMA_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'firma.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:FIRMA_PFX_BASE64))
          "FIRMA_PFX=$pfx" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Compilar
        shell: cmd
        env:
          FIRMA_CLAVE: ${{ secrets.FIRMA_CLAVE }}
          FIRMA_SELLO: ${{ vars.FIRMA_SELLO }}
        run: compilar.cmd

      - name: Borrar el certificado
        if: always() && env.FIRMA_PFX != ''
        shell: pwsh
        run: Remove-Item -Force $env:FIRMA_PFX -ErrorAction SilentlyContinue

      - name: SHA256
        shell: pwsh
        run: |
          $h = (Get-FileHash salida\Instalar-Home.exe -Algorithm SHA256).Hash.ToLower()
          "$h  Instalar-Home.exe" | Out-File -Encoding ascii salida\Instalar-Home.exe.sha256
          Get-Content salida\Instalar-Home.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Instalar-Home
          path: salida/

      # Con una etiqueta vX.Y se publica la release con el .exe y su SHA256. Si la release ya existe (la etiqueta se ha
      # movido a un commit nuevo), solo se cambian el .exe y su SHA256: notas, «previa» y demás archivos se quedan igual
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ETIQUETA: ${{ github.ref_name }}
        run: |
          gh release view $env:ETIQUETA --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:ETIQUETA salida/Instalar-Home.exe salida/Instalar-Home.exe.sha256 --clobber
          } else {
            gh release create $env:ETIQUETA salida/Instalar-Home.exe salida/Instalar-Home.exe.sha256 `
              --title "Instalar Home $env:ETIQUETA" --generate-notes
          }
