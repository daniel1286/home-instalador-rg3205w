# hostapd.conf — AP Home-migracion 5 GHz WPA2 ES  (ALTERNATIVA)
# Usar solo si confirmas que el Askey asocia en 5 GHz. Para activarlo:
#   sudo cp /opt/mh-fake/config/hostapd-5g.conf /etc/hostapd/hostapd.conf
#   sudo systemctl restart hostapd

interface=wlan0
driver=nl80211

ssid=Home-migracion

hw_mode=a
channel=36
country_code=ES
ieee80211d=1
ieee80211h=1
ieee80211n=1
ieee80211ac=1
ht_capab=[HT40+][SHORT-GI-20][SHORT-GI-40]
vht_oper_chwidth=1
vht_oper_centr_freq_seg0_idx=42
wmm_enabled=1

wpa=2
wpa_passphrase=homeupdate
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
auth_algs=1

ignore_broadcast_ssid=0
logger_syslog=-1
logger_syslog_level=2
