# dnsmasq.conf — DHCP + DNS overrides para el backend local del RG3205W
# Reemplazar en /etc/dnsmasq.d/home-backend.conf o /etc/dnsmasq.conf

interface=wlan0
bind-dynamic

# Rechazar queries que no sean nuestras (seguridad)
domain-needed
bogus-priv

# DHCP pool 10.42.0.100-200/24
dhcp-range=10.42.0.100,10.42.0.200,24h
dhcp-option=3,10.42.0.1
dhcp-option=6,10.42.0.1
dhcp-authoritative

# No resolver nada contra /etc/hosts del host
no-resolv
no-poll

# Overrides de los dominios que usa la ROM (verificados en el emulador AWS).
# address=/dominio/IP intercepta el dominio Y todos sus subdominios.
address=/main.acs.telefonica.net/10.42.0.1
address=/api.es-pro-movistar-home.com/10.42.0.1
address=/api.es-pro.movistar-home.com/10.42.0.1
address=/api.es-dev-movistar-home.com/10.42.0.1
# El JWT de auth (/v2/auth/jwt) vive AQUI, no en api.es-pro: imprescindible.
address=/imagenio.telefonica.net/10.42.0.1
# Recursos (imagenes/sonidos) y video de bienvenida (HLS en blob de Azure).
address=/s3.eu-west-1.amazonaws.com/10.42.0.1
address=/s3.amazonaws.com/10.42.0.1
address=/blob.core.windows.net/10.42.0.1
address=/europe.directline.botframework.com/10.42.0.1
address=/auth.crt.nuance.com/10.42.0.1

# NTP — controlar el reloj (certificados eMudhra validos en julio 2025)
address=/time.android.com/10.42.0.1
address=/time.google.com/10.42.0.1
address=/pool.ntp.org/10.42.0.1

# Factory provisioning
address=/autodeployment.com/10.42.0.1

# Captive portal (Android valida internet contra estos)
address=/connectivitycheck.gstatic.com/10.42.0.1
address=/connectivitycheck.android.com/10.42.0.1
address=/clients3.google.com/10.42.0.1
address=/clients4.google.com/10.42.0.1
address=/www.google.com/10.42.0.1

# Google services (el dispositivo puede resolver estos)
address=/play.googleapis.com/10.42.0.1
address=/android.googleapis.com/10.42.0.1

# Si quieres que TODA la resolución externa falle (recomendado — así el aparato
# no habla con nadie más que con nosotros):
address=/#/0.0.0.0
# Esta línea anterior hace que CUALQUIER dominio no listado resuelva a 0.0.0.0.
# Si prefieres pass-through a 1.1.1.1 para dominios que no interceptas, comenta
# la línea anterior y descomenta:
#server=1.1.1.1

# Log DNS
log-queries
log-dhcp
