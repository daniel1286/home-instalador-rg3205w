<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141210"/>
      <stop offset="100%" stop-color="#0C0B09"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="420" rx="12" fill="url(#bg)"/>

  <!-- Titulo -->
  <text x="400" y="38" text-anchor="middle" fill="#E0A85A" font-size="16" font-weight="600">Arquitectura de red</text>

  <!-- Router -->
  <rect x="310" y="65" width="180" height="64" rx="10" fill="none" stroke="#5A4A30" stroke-width="1.5"/>
  <text x="400" y="93" text-anchor="middle" fill="#F0E8D8" font-size="13" font-weight="600">Router</text>
  <text x="400" y="113" text-anchor="middle" fill="#A08870" font-size="11">Internet / red local</text>

  <!-- Raspberry Pi -->
  <rect x="80" y="200" width="260" height="130" rx="10" fill="#1A1814" stroke="#E0A85A" stroke-width="1.5"/>
  <text x="210" y="228" text-anchor="middle" fill="#E0A85A" font-size="14" font-weight="600">Raspberry Pi</text>
  <text x="210" y="250" text-anchor="middle" fill="#C8B8A0" font-size="11">eth0: DHCP (al router)</text>
  <text x="210" y="268" text-anchor="middle" fill="#C8B8A0" font-size="11">wlan0: 10.42.0.1 (AP)</text>
  <text x="210" y="292" text-anchor="middle" fill="#A08870" font-size="10">DNS · NTP · TLS/SNI · CWMP</text>
  <text x="210" y="308" text-anchor="middle" fill="#A08870" font-size="10">OTA · Panel · Captive portal</text>
  <text x="210" y="322" text-anchor="middle" fill="#706050" font-size="9">9 servicios en /opt/mh-fake/</text>

  <!-- RG3205W -->
  <rect x="460" y="210" width="260" height="110" rx="10" fill="#1A1814" stroke="#C89240" stroke-width="1.5"/>
  <text x="590" y="240" text-anchor="middle" fill="#C89240" font-size="14" font-weight="600">Askey RG3205W</text>
  <text x="590" y="262" text-anchor="middle" fill="#C8B8A0" font-size="11">WiFi: 10.42.0.x</text>
  <text x="590" y="280" text-anchor="middle" fill="#A08870" font-size="10">Se conecta a «Home-migracion»</text>
  <text x="590" y="296" text-anchor="middle" fill="#A08870" font-size="10">Descarga el pivot OTA</text>
  <text x="590" y="312" text-anchor="middle" fill="#706050" font-size="9">Solo 5 GHz · canal 36</text>

  <!-- Conexion ethernet: Router <-> Pi -->
  <line x1="310" y1="97" x2="210" y2="97" stroke="#5A4A30" stroke-width="1" stroke-dasharray="6,3"/>
  <line x1="210" y1="97" x2="210" y2="200" stroke="#5A4A30" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="175" y="155" fill="#706050" font-size="10" text-anchor="middle" transform="rotate(-90,175,155)">Ethernet</text>

  <!-- Conexion WiFi: Pi <-> RG3205W -->
  <line x1="340" y1="265" x2="460" y2="265" stroke="#E0A85A" stroke-width="2" filter="url(#glow)"/>
  <circle cx="370" cy="265" r="3" fill="#E0A85A" opacity="0.6"/>
  <circle cx="400" cy="265" r="3" fill="#E0A85A"/>
  <circle cx="430" cy="265" r="3" fill="#E0A85A" opacity="0.6"/>
  <text x="400" y="255" text-anchor="middle" fill="#E0A85A" font-size="10" font-weight="500">WiFi 5 GHz</text>

  <!-- Panel web -->
  <rect x="80" y="360" width="180" height="44" rx="8" fill="none" stroke="#5A4A30" stroke-width="1"/>
  <text x="170" y="382" text-anchor="middle" fill="#C8B8A0" font-size="11">Panel de control</text>
  <text x="170" y="396" text-anchor="middle" fill="#706050" font-size="10">http://10.42.0.1:8080</text>

  <!-- Flecha panel -> Pi -->
  <line x1="170" y1="360" x2="190" y2="330" stroke="#5A4A30" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- Leyenda -->
  <line x1="540" y1="370" x2="570" y2="370" stroke="#E0A85A" stroke-width="2"/>
  <text x="578" y="374" fill="#A08870" font-size="10">WiFi (5 GHz)</text>
  <line x1="540" y1="390" x2="570" y2="390" stroke="#5A4A30" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="578" y="394" fill="#A08870" font-size="10">Ethernet / HTTP</text>
</svg>