<!-- Fuente de recursos/guia/recovery_menu.png (hacer.ps1): el menú del recovery de fábrica, pasos 7 a 9 -->
<html lang="es"><head><meta charset="utf-8"><title>recovery_menu</title>
<link rel="stylesheet" href="estilo.css">
<style>
  .marco { background: #2c2a27; border: 2px solid #ddd6ca; border-radius: 16px; padding: 10px; }
  .menu { background: #000; border-radius: 4px; padding: 10px 12px; font-family: Consolas, monospace; font-size: 13px; line-height: 1.6; color: #4aa3ff; }
  .menu .cab { color: #f0a030; }
  .menu .hueco { height: 8px; }
  .menu .sel { background: #2f7fd8; color: #000; font-weight: 700; margin: 2px -6px; padding: 0 6px; border-radius: 3px;
    outline: 2px solid var(--ambar); outline-offset: 1px; display: flex; justify-content: space-between; }
  .menu .sel span { font-family: Inter, sans-serif; font-size: 12px; color: var(--ambar-oscuro); background: var(--ambar); padding: 0 6px; border-radius: 3px; margin: 2px 0; }
</style></head>
<body>
  <div class="marco"><div class="menu">
    <div class="cab">Android Recovery</div>
    <div class="cab">Use volume up/down and power.</div>
    <div class="hueco"></div>
    <div>Reboot system now</div>
    <div class="sel">Reboot to bootloader<span>Encendido para elegirla</span></div>
    <div>Apply update from ADB</div>
    <div>Apply update from SD card</div>
    <div>Wipe data/factory reset</div>
    <div>Wipe cache partition</div>
    <div>Power off</div>
  </div></div>
  <div class="pie">Menú del recovery de fábrica: las opciones y los colores pueden variar un poco.</div>
</body></html>
